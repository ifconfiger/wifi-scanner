name: Release

on:
  push:
    tags:
      - "main-v*.*.*"

permissions:
  contents: write

jobs:
  build:
    # macos-latest 为 Apple Silicon (arm64) runner
    runs-on: macos-latest
    env:
      APPLE_SIGN_P12: ${{ secrets.APPLE_SIGN_P12 }}
      APPLE_SIGN_PASSWORD: ${{ secrets.APPLE_SIGN_PASSWORD }}
      APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
    steps:
      - uses: actions/checkout@v4

      - name: Parse version
        run: |
          VERSION="${GITHUB_REF_NAME#main-v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag 格式应为 main-vX.Y.Z，实际：$GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # 证书 secrets 齐全才走 Developer ID 签名 + 公证；否则退回 ad-hoc（如 fork 仓库）
      - name: Check signing secrets
        run: |
          if [[ -n "$APPLE_SIGN_P12" && -n "$APPLE_SIGN_PASSWORD" ]]; then
            echo "SIGN=1" >> "$GITHUB_ENV"
            if [[ -n "$APPLE_NOTARY_KEY" && -n "$APPLE_NOTARY_KEY_ID" && -n "$APPLE_NOTARY_ISSUER" ]]; then
              echo "NOTARIZE=1" >> "$GITHUB_ENV"
            else
              echo "::warning::缺少 APPLE_NOTARY_* secrets，只签名不公证"
            fi
          else
            echo "::warning::缺少 APPLE_SIGN_* secrets，使用 ad-hoc 签名"
          fi

      - name: Import signing certificate
        if: env.SIGN == '1'
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          P12="$RUNNER_TEMP/cert.p12"
          echo "$APPLE_SIGN_P12" | base64 --decode > "$P12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$APPLE_SIGN_PASSWORD" \
            -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$P12"

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')"
          if [[ -z "$IDENTITY" ]]; then
            echo "p12 中没有 Developer ID Application 证书" >&2
            security find-identity -v -p codesigning "$KEYCHAIN" >&2
            exit 1
          fi
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Build
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          swift --version
          ./build.sh
          lipo -archs build/WiFiScope.app/Contents/MacOS/WiFiScope
          codesign -dv --entitlements - build/WiFiScope.app 2>&1

      - name: Notarize
        if: env.NOTARIZE == '1'
        run: |
          KEY="$RUNNER_TEMP/AuthKey.p8"
          # 兼容直接粘贴 .p8 内容或其 base64
          if [[ "$APPLE_NOTARY_KEY" == *"BEGIN PRIVATE KEY"* ]]; then
            printf '%s\n' "$APPLE_NOTARY_KEY" > "$KEY"
          else
            echo "$APPLE_NOTARY_KEY" | base64 --decode > "$KEY"
          fi
          AUTH=(--key "$KEY" --key-id "$APPLE_NOTARY_KEY_ID" --issuer "$APPLE_NOTARY_ISSUER")

          SUBMIT_ZIP="$RUNNER_TEMP/notarize.zip"
          ditto -c -k --keepParent build/WiFiScope.app "$SUBMIT_ZIP"
          RESULT="$(xcrun notarytool submit "$SUBMIT_ZIP" "${AUTH[@]}" \
            --wait --timeout 30m --output-format json)"
          echo "$RESULT"
          ID="$(echo "$RESULT" | jq -r .id)"
          STATUS="$(echo "$RESULT" | jq -r .status)"
          # 无论成败都打印日志，便于排查（Accepted 时也可能有警告）
          xcrun notarytool log "$ID" "${AUTH[@]}" || true
          rm -f "$KEY"
          if [[ "$STATUS" != "Accepted" ]]; then
            echo "公证失败：$STATUS" >&2
            exit 1
          fi

          # 钉入公证票据，离线也能通过 Gatekeeper
          xcrun stapler staple build/WiFiScope.app
          xcrun stapler validate build/WiFiScope.app
          spctl --assess --type execute -vv build/WiFiScope.app

      - name: Package
        run: |
          ZIP="WiFiScope-${VERSION}-macos-arm64.zip"
          ditto -c -k --keepParent build/WiFiScope.app "$ZIP"
          shasum -a 256 "$ZIP" > "$ZIP.sha256"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="仅支持 Apple Silicon (arm64)，macOS 13+。"
          if [[ "${NOTARIZE:-}" == "1" ]]; then
            NOTES+=" 已使用 Developer ID 签名并通过 Apple 公证，解压后直接打开即可。"
          else
            NOTES+=" 未经公证，首次打开前执行：\`xattr -dr com.apple.quarantine /Applications/WiFiScope.app\`"
          fi
          gh release create "$GITHUB_REF_NAME" "$ZIP" "$ZIP.sha256" \
            --title "WiFiScope ${VERSION}" \
            --generate-notes \
            --notes "$NOTES"

      - name: Clean up keychain
        if: always() && env.KEYCHAIN != ''
        run: security delete-keychain "$KEYCHAIN" || true
