name: Release

on:
  push:
    tags:
      - "main-v*.*.*"

permissions:
  contents: write

jobs:
  build:
    # macos-latest is an Apple Silicon (arm64) runner
    runs-on: macos-latest
    env:
      APPLE_SIGN_P12: ${{ secrets.APPLE_SIGN_P12 }}
      APPLE_SIGN_PASSWORD: ${{ secrets.APPLE_SIGN_PASSWORD }}
      APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
    steps:
      - uses: actions/checkout@v4

      - name: Parse version
        run: |
          VERSION="${GITHUB_REF_NAME#main-v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must look like main-vX.Y.Z, got: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # Sign with Developer ID and notarize only when the secrets are present; otherwise fall back to ad-hoc (e.g. forks)
      - name: Check signing secrets
        run: |
          if [[ -n "$APPLE_SIGN_P12" && -n "$APPLE_SIGN_PASSWORD" ]]; then
            echo "SIGN=1" >> "$GITHUB_ENV"
            if [[ -n "$APPLE_NOTARY_KEY" && -n "$APPLE_NOTARY_KEY_ID" && -n "$APPLE_NOTARY_ISSUER" ]]; then
              echo "NOTARIZE=1" >> "$GITHUB_ENV"
            else
              echo "::warning::APPLE_NOTARY_* secrets missing; signing without notarization"
            fi
          else
            echo "::warning::APPLE_SIGN_* secrets missing; using ad-hoc signing"
          fi

      - name: Import signing certificate
        if: env.SIGN == '1'
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          P12="$RUNNER_TEMP/cert.p12"
          echo "$APPLE_SIGN_P12" | base64 --decode > "$P12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$APPLE_SIGN_PASSWORD" \
            -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$P12"

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')"
          if [[ -z "$IDENTITY" ]]; then
            echo "No Developer ID Application certificate in the p12" >&2
            security find-identity -v -p codesigning "$KEYCHAIN" >&2
            exit 1
          fi
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Build
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          swift --version
          ./build.sh
          lipo -archs build/WiFi-Scanner.app/Contents/MacOS/WiFi-Scanner
          codesign -dv --entitlements - build/WiFi-Scanner.app 2>&1

      # Notarize and staple the app first so the copy inside the DMG carries its own ticket
      - name: Notarize app
        if: env.NOTARIZE == '1'
        run: |
          SUBMIT_ZIP="$RUNNER_TEMP/notarize.zip"
          ditto -c -k --keepParent build/WiFi-Scanner.app "$SUBMIT_ZIP"
          tools/notarize.sh "$SUBMIT_ZIP" build/WiFi-Scanner.app
          spctl --assess --type execute -vv build/WiFi-Scanner.app

      - name: Build DMG
        run: |
          DMG="WiFi-Scanner-${VERSION}-macos-arm64.dmg"
          tools/make_dmg.sh "build/$DMG"
          echo "DMG=$DMG" >> "$GITHUB_ENV"

      - name: Notarize DMG
        if: env.NOTARIZE == '1'
        run: |
          tools/notarize.sh "build/$DMG" "build/$DMG"
          spctl --assess --type open --context context:primary-signature -vv "build/$DMG"

      - name: Package
        run: |
          # The DMG is for people; the zip of the stapled app is what the in-app updater installs
          ZIP="WiFi-Scanner-${VERSION}-macos-arm64.zip"
          ditto -c -k --keepParent build/WiFi-Scanner.app "build/$ZIP"
          cd build
          shasum -a 256 "$DMG" "$ZIP" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Download \`$DMG\`, open it and drag WiFi-Scanner to Applications. Apple Silicon (arm64) only, macOS 13+."
          if [[ "${NOTARIZE:-}" == "1" ]]; then
            NOTES+=" Signed with Developer ID and notarized by Apple."
          else
            NOTES+=" Not notarized; before the first launch run: \`xattr -dr com.apple.quarantine /Applications/WiFi-Scanner.app\`"
          fi
          gh release create "$GITHUB_REF_NAME" "build/$DMG" "build/$ZIP" build/SHA256SUMS.txt \
            --title "WiFi-Scanner ${VERSION}" \
            --generate-notes \
            --notes "$NOTES"

      - name: Clean up keychain
        if: always() && env.KEYCHAIN != ''
        run: security delete-keychain "$KEYCHAIN" || true
