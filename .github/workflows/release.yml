name: Release

on:
  push:
    tags:
      - "main-v*.*.*"

permissions:
  contents: write

jobs:
  build:
    # macos-latest is an Apple Silicon (arm64) runner
    runs-on: macos-latest
    env:
      APPLE_SIGN_P12: ${{ secrets.APPLE_SIGN_P12 }}
      APPLE_SIGN_PASSWORD: ${{ secrets.APPLE_SIGN_PASSWORD }}
      APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
    steps:
      - uses: actions/checkout@v4

      - name: Parse version
        run: |
          VERSION="${GITHUB_REF_NAME#main-v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must look like main-vX.Y.Z, got: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # Sign with Developer ID and notarize only when the secrets are present; otherwise fall back to ad-hoc (e.g. forks)
      - name: Check signing secrets
        run: |
          if [[ -n "$APPLE_SIGN_P12" && -n "$APPLE_SIGN_PASSWORD" ]]; then
            echo "SIGN=1" >> "$GITHUB_ENV"
            if [[ -n "$APPLE_NOTARY_KEY" && -n "$APPLE_NOTARY_KEY_ID" && -n "$APPLE_NOTARY_ISSUER" ]]; then
              echo "NOTARIZE=1" >> "$GITHUB_ENV"
            else
              echo "::warning::APPLE_NOTARY_* secrets missing; signing without notarization"
            fi
          else
            echo "::warning::APPLE_SIGN_* secrets missing; using ad-hoc signing"
          fi

      - name: Import signing certificate
        if: env.SIGN == '1'
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          P12="$RUNNER_TEMP/cert.p12"
          echo "$APPLE_SIGN_P12" | base64 --decode > "$P12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$APPLE_SIGN_PASSWORD" \
            -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$P12"

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')"
          if [[ -z "$IDENTITY" ]]; then
            echo "No Developer ID Application certificate in the p12" >&2
            security find-identity -v -p codesigning "$KEYCHAIN" >&2
            exit 1
          fi
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Build
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          swift --version
          ./build.sh
          lipo -archs build/WiFiScope.app/Contents/MacOS/WiFiScope
          codesign -dv --entitlements - build/WiFiScope.app 2>&1

      - name: Notarize
        if: env.NOTARIZE == '1'
        run: |
          KEY="$RUNNER_TEMP/AuthKey.p8"
          # Accept either the raw .p8 contents or its base64
          if [[ "$APPLE_NOTARY_KEY" == *"BEGIN PRIVATE KEY"* ]]; then
            printf '%s\n' "$APPLE_NOTARY_KEY" > "$KEY"
          else
            echo "$APPLE_NOTARY_KEY" | base64 --decode > "$KEY"
          fi
          AUTH=(--key "$KEY" --key-id "$APPLE_NOTARY_KEY_ID" --issuer "$APPLE_NOTARY_ISSUER")

          SUBMIT_ZIP="$RUNNER_TEMP/notarize.zip"
          ditto -c -k --keepParent build/WiFiScope.app "$SUBMIT_ZIP"
          RESULT="$(xcrun notarytool submit "$SUBMIT_ZIP" "${AUTH[@]}" \
            --wait --timeout 30m --output-format json)"
          echo "$RESULT"
          ID="$(echo "$RESULT" | jq -r .id)"
          STATUS="$(echo "$RESULT" | jq -r .status)"
          # Always print the log for troubleshooting (Accepted submissions may still carry warnings)
          xcrun notarytool log "$ID" "${AUTH[@]}" || true
          rm -f "$KEY"
          if [[ "$STATUS" != "Accepted" ]]; then
            echo "Notarization failed: $STATUS" >&2
            exit 1
          fi

          # Staple the ticket so Gatekeeper passes even offline
          xcrun stapler staple build/WiFiScope.app
          xcrun stapler validate build/WiFiScope.app
          spctl --assess --type execute -vv build/WiFiScope.app

      - name: Package
        run: |
          ZIP="WiFiScope-${VERSION}-macos-arm64.zip"
          ditto -c -k --keepParent build/WiFiScope.app "$ZIP"
          shasum -a 256 "$ZIP" > "$ZIP.sha256"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Apple Silicon (arm64) only, macOS 13+."
          if [[ "${NOTARIZE:-}" == "1" ]]; then
            NOTES+=" Signed with Developer ID and notarized by Apple; unzip and open."
          else
            NOTES+=" Not notarized; before the first launch run: \`xattr -dr com.apple.quarantine /Applications/WiFiScope.app\`"
          fi
          gh release create "$GITHUB_REF_NAME" "$ZIP" "$ZIP.sha256" \
            --title "WiFiScope ${VERSION}" \
            --generate-notes \
            --notes "$NOTES"

      - name: Clean up keychain
        if: always() && env.KEYCHAIN != ''
        run: security delete-keychain "$KEYCHAIN" || true
